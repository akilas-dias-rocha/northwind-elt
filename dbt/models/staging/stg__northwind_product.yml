version: 2

models:
  - name: stg__northwind_product
    description: >
      Staging model for the products. Registers information about each product, including the supplier,
      category, and inventory details.
    columns:
      - name: product_id
        data_type: string
        data_tests:
          - unique
          - not_null
        description: >
          The unique identifier for each record in the `products` table.

      - name: product_name
        data_type: string
        data_tests:
          - unique
          - not_null
        description: >
          The name of the product.

      - name: supplier_id
        data_type: int
        data_tests:
          - not_null
          - relationships:
              to: ref('stg__northwind_supplier')
              field: supplier_id
        description: >
          The identifier for the supplier of the product. This field links the product
          to a specific supplier in the `suppliers` table.

      - name: category_id
        data_type: int
        data_tests:
          - not_null
          - relationships:
              to: ref('stg__northwind_category')
              field: category_id
        description: >
          The identifier for the category of the product. This field links the product
          to a specific category in the `categories` table.

      - name: quantity_per_unit
        data_type: string
        description: >
          The quantity of the product per unit. This field is used for inventory management
          and reporting purposes.

      - name: unit_price
        data_type: decimal(10,2)
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: ">= 0"
        description: >
          The price of each unit of the product. This field is used for pricing and reporting purposes.

      - name: units_in_stock
        data_type: int
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: ">= 0"
        description: >
          The number of units of the product currently in stock. This field is used for inventory management
          and reporting purposes.

      - name: units_on_order
        data_type: int
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: ">= 0"
        description: >
          The number of units of the product currently on order. This field is used for inventory management
          and reporting purposes.

      - name: reorder_level
        data_type: int
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: ">= 0"
        description: >
          The reorder level for the product. This field is used for inventory management
          and reporting purposes.

      - name: is_discontinued
        data_type: boolean
        data_tests:
          - not_null
        description: >
          A flag indicating whether the product is discontinued. This field is used for inventory management
          and reporting purposes.

      - name: _updated_at
        data_type: timestamp
        description: >
          Timestamp when the record was last updated in the source system.
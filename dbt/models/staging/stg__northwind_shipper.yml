version: 2

models:
  - name: stg__northwind_shipper
    description: >
      Staging model for the shippers. It registers information about each shipper, including the
      company name and contact details.
    columns:
      - name: shipper_id
        data_type: int
        description: >
          The unique identifier for each record in the `shippers` table.''

      - name: company_name
        data_type: string
        description: >
          The name of the shipping company. This field is used to identify and communicate with the shipper.

      - name: phone
        data_type: string
        description: >
          The phone number of the shipper. This field is used for communication purposes.
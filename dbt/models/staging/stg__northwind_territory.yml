version: 2

models:
  - name: stg__northwind_territory
    description: >
      Staging model for the territories. Registers information about each territory, including the
      description and the region it belongs to.
    columns:
      - name: territory_id
        data_type: string
        data_tests:
          - unique
          - not_null
        description: >
          The unique identifier for each record in the `territories` table.

      - name: territory_description
        data_type: string
        data_tests:
          - not_null
        description: >
          A description of the territory.

      - name: region_id
        data_type: int
        data_tests:
          - not_null
          - relationships:
              to: ref('stg__northwind_region')
              field: region_id
        description: >
          The identifier for the region to which the territory belongs. This field links the territory
          to a specific region in the `regions` table.

      - name: _updated_at
        data_type: timestamp
        description: >
          Timestamp when the record was last updated in the source system.
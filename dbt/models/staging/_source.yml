version: 2

sources:
  - name: northwind
    database: northwind_raw_data
    schema: source_sql_db
    description: >
      This is the source for the Northwind database, which contains data about a 
      company that sells products to customers around the world. The database includes tables 
      for categories, customers, employees, orders, products, and more.
    freshness:
      warn_after: {count: 24, period: hour}
      error_after: {count: 48, period: hour}
    loaded_at_field: _updated_at
    tables:
      - name: category
        description: >
          This table contains information about the different categories of products that the company sells. 
          Each category has a unique ID, a name, and a description.

      - name: customer
        description: >
          This table contains information about the customers of the company. 
          Each customer has a unique ID, a name, and contact information.

      - name: employee
        description: >
          Employees of the company. 
          Each employee has a unique ID, a name, and job title.

      - name: order
        description: >
          Orders placed by customers. 
          Each order has a unique ID, a customer ID, and a date.

      - name: orderdetail
        description: >
          Contains information about the products included in each order. 
          Each record links an order to a specific product and includes the quantity and price.

      - name: product
        description: >
          Products sold by the company. 
          Each product has a unique ID, a name, and a description.

      - name: shipper
        description: >
          Shippers who deliver orders to customers. 
          Each shipper has a unique ID, a name, and contact information.

      - name: supplier
        description: >
          Suppliers who provide products to the company. 
          Each supplier has a unique ID, a name, and contact information.

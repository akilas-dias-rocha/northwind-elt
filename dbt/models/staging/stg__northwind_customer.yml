version: 2

models:
  - name: stg__northwind_customer
    description: >
      Staging table for customers. Each record represents a customer with their associated details
      such as company name, contact information, and location.
    columns:
      - name: customer_id
        data_type: string
        data_tests:
          - unique
          - not_null
        description: >
           The unique identifier for a customer.

      - name: company_name
        data_type: string
        data_tests:
          - not_null
        description: >
           The name of the customer's company.
      - name: contact_name
        data_type: string
        description: >
           The name of the customer's contact person.

      - name: contact_title
        data_type: string
        description: >
            The title of the customer's contact person.

      - name: address
        data_type: string
        data_tests:
          - not_null
        description: >
            The street address of the customer.

      - name: city
        data_type: string
        data_tests:
          - not_null
        description: >
            The city where the customer is located.

      - name: region
        data_type: string
        data_tests:
          - not_null
        description: >
            The region or state where the customer is located.

      - name: postal_code
        data_type: string
        description: >
            The postal code of the customer's location.

      - name: country
        data_type: string
        data_tests:
          - not_null
        description: >
            The country where the customer is located.

      - name: phone
        data_type: string
        description: >
            The phone number of the customer.

      - name: fax
        data_type: string
        description: >
            The fax number of the customer.
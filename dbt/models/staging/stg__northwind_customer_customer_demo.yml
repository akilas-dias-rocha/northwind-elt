version: 2

models:
  - name: stg__northwind_customer_customer_demo
    description: >
      This is a staging model for the `customer_customer_demo` table from the Northwind database.
      It serves as an intermediate step in the data transformation process, allowing for data cleaning
      and preparation before being used in downstream models.
    columns:
      - name: id
        data_type: int
        data_tests:
          - unique
          - not_null
        description: >
          The unique identifier for each record in the `customer_customer_demo` table.

      - name: customer_type_id
        data_type: string
        description: >
          The identifier for the type of customer.

      - name: _updated_at
        data_type: timestamp
        description: >
          Timestamp when the record was last updated in the source system.
version: 2

models:
  - name: agg__customer_metrics
    description: >
      Aggregated customer metrics for RFM analysis and Lifetime Value calculations.
      One row per customer with recency, frequency, monetary value, and order counts.
    columns:
      - name: customer_id
        description: Unique customer identifier
        data_tests:
          - unique
          - not_null

      - name: customer_name
        description: Company name of the customer
        data_tests:
          - not_null

      - name: recency
        description: Number of days since the customer's last order. 0 if customer has no orders.
        data_tests:
          - not_null

      - name: is_active
        description: Indicates if the customer has placed at least one order (True/False)
        data_tests:
          - not_null

      - name: total_amount
        description: Sum of net amount across all customer orders
        data_tests:
          - not_null

      - name: qnt_orders
        description: Total quantity of orders placed by the customer
        data_tests:
          - not_null

      - name: average_order_value
        description: Average net amount per order (total_amount / qnt_orders). Returns 0 if no orders.
        data_tests:
          - not_null

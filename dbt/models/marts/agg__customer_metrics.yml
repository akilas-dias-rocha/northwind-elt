version: 2

models:
  - name: agg__customer_metrics
    description: >
      Aggregated customer metrics for RFM analysis and Lifetime Value calculations.
      One row per customer with recency, frequency, monetary value, and order counts.
    columns:
      - name: customer_id
        description: Unique customer identifier
        data_tests:
          - unique
          - not_null

      - name: customer_name
        description: Company name of the customer
        data_tests:
          - not_null

      - name: recency
        description: Number of days since the customer's last order
        data_tests:
          - not_null

      - name: frequency
        description: Total number of distinct orders placed by the customer
        data_tests:
          - not_null

      - name: total_amount
        description: Sum of net amount across all customer orders
        data_tests:
          - not_null

      - name: qnt_orders
        description: Total quantity of orders placed by the customer
        data_tests:
          - not_null

      - name: average_order_value
        description: Average net amount per order (total_amount / qnt_orders)
        data_tests:
          - not_null

version: 2

models:
  - name: agg__abc_classification
    description: >
      ABC classification of products per quarter based on cumulative sales contribution.
      Class A: products representing up to 80% of quarterly sales.
      Class B: products representing 80%-95% of quarterly sales.
      Class C: remaining products (>95%).
    columns:
      - name: product_quarter_sk
        description: Surrogate key from product_id, year, and quarter
        data_tests:
          - unique
          - not_null

      - name: product_id
        description: Unique product identifier
        data_tests:
          - not_null

      - name: year
        description: Calendar year
        data_tests:
          - not_null

      - name: quarter
        description: Calendar quarter (1-4)
        data_tests:
          - not_null

      - name: total_sales
        description: Product's total sales in the quarter
        data_tests:
          - not_null

      - name: quarterly_total
        description: Total sales across all products in the quarter
        data_tests:
          - not_null

      - name: cumulative_sales
        description: Running total of sales ranked by descending sales
        data_tests:
          - not_null

      - name: cumulative_pct
        description: Cumulative percentage of quarterly total (0-100)
        data_tests:
          - not_null

      - name: abc_class
        description: ABC classification based on cumulative sales percentage
        data_tests:
          - not_null
          - accepted_values:
              values: ['A', 'B', 'C']

version: 2

models:
  - name: int__employee_pii
    description: >
      Dimension model containing detailed profile information for all employees,
      including personal data (PII), contact details, organizational hierarchy,
      and demographic information.
      Note: This model contains PII columns (address, postal_code).
    columns:
      - name: employee_id
        description: >
          The unique identifier for each employee record.
        data_tests:
          - unique
          - not_null

      - name: last_name
        description: >
          The last name of the employee.

      - name: first_name
        description: >
          The first name of the employee.

      - name: title
        description: >
          The job title or position of the employee within the organization.

      - name: title_of_courtesy
        description: >
          The honorific or courtesy title used to address the employee (e.g., Mr., Ms., Dr.).

      - name: birth_date
        description: >
          The employee's date of birth. Contains PII - handle with care.

      - name: hire_date
        description: >
          The date when the employee was hired. Used for tenure calculations and reporting.

      - name: address
        description: >
          The street address of the employee's residence. Contains PII - excluded from dim__employee.

      - name: city
        description: >
          The city where the employee resides.

      - name: region
        description: >
          The state, province, or region where the employee resides.

      - name: postal_code
        description: >
          The postal or ZIP code of the employee's address. Contains PII - excluded from dim__employee.

      - name: country
        description: >
          The country where the employee resides.

      - name: home_phone
        description: >
          The employee's home telephone number. Contains PII - handle with care.

      - name: extension
        description: >
          The internal phone extension number for the employee.

      - name: photo
        description: >
          The binary data or path to the employee's photograph.

      - name: notes
        description: >
          Additional notes or comments about the employee.

      - name: reports_to
        description: >
          The employee_id of the manager to whom this employee reports. Establishes the organizational hierarchy.

      - name: photo_path
        description: >
          The file path or URL to the employee's photo file.
